<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roka AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #121212;
        color: #ececec;
      }

      /* Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #1e1e1e;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #2f2f2f;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #444;
      }

      /* ChatGPT-like chat bubbles */
      .chat-bubble {
        background: #2f2f2f;
        border: 1px solid #3b3b3b;
        padding: 1rem 1.25rem;
        border-radius: 1rem;
        line-height: 1.6;
        color: #ececec;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      }
      .chat-bubble.user {
        background: #3a3a3a;
        color: #fff;
      }

      /* ChatGPT-like input bar */
      .chat-input {
        background-color: #1e1e1e;
        border: 1px solid #2f2f2f;
        border-radius: 0.75rem;
        color: #fff;
        padding: 0.75rem 1rem;
        transition: all 0.3s ease;
      }
      .chat-input:focus {
        border-color: #10a37f;
        box-shadow: 0 0 8px #10a37f;
        outline: none;
      }

      /* Send button (ChatGPT style) */
      .send-btn {
        background-color: #10a37f;
        color: white;
        border-radius: 0.75rem;
        padding: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s ease;
      }
      .send-btn:hover {
        background-color: #0e8e70;
      }

      /* Header toggle styling */
      .mode-toggle button {
        transition: all 0.25s ease-in-out;
      }
      .mode-toggle button.active {
        background: #10a37f;
        color: white;
        box-shadow: 0 0 8px rgba(16, 163, 127, 0.6);
      }
      .mode-toggle button:not(.active):hover {
        background-color: #2a2a2a;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
        }
      }
    </script>
  </head>

  <body class="antialiased">
    <div id="app-root" class="flex h-screen w-full flex-col"></div>

    <script type="module">
      import { GoogleGenAI } from "@google/genai";

      const SparklesIcon = (className = "h-6 w-6") =>
        `<svg class="${className}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" /></svg>`;

      const ChatBubbleIcon = (className = "h-5 w-5") =>
        `<svg class="${className}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" /></svg>`;

      const PhotoIcon = (className = "h-5 w-5") =>
        `<svg class="${className}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5z" /></svg>`;

      const PaperAirplaneIcon = (className = "h-6 w-6") =>
        `<svg class="${className}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" /></svg>`;

      let state = {
        mode: "chat",
        messages: [],
        isLoading: false,
        apiKey: "AIzaSyDwt2FxCJZxZr7ag7pqqGFD1K6T-iQcc2s",
      };
      let ai = null;

      const appRoot = document.getElementById("app-root");

      function initializeAi() {
        if (state.apiKey) {
          try {
            ai = new GoogleGenAI({ apiKey: state.apiKey });
            return true;
          } catch (error) {
            console.error("Failed to initialize GoogleGenAI:", error);
            return false;
          }
        }
        return false;
      }

      async function runChat(prompt) {
        if (!ai) return "Gemini API initialization failed.";
        try {
          const response = await ai.models.generateContent({
            model: "gemini-2.5-flash",
            contents: [{ parts: [{ text: prompt }] }],
          });
          return response.text;
        } catch (error) {
          console.error("Gemini API error:", error);
          return "An error occurred while generating the response.";
        }
      }

      function render() {
        appRoot.innerHTML = `
        <header class="flex flex-col items-center justify-center border-b border-gray-800 p-4 text-center">
          <div class="flex items-center gap-3">
            ${SparklesIcon("h-8 w-8 text-emerald-400")}
            <h1 class="text-2xl font-semibold text-white">Roka AI</h1>
          </div>
          <p class="mt-1 text-sm text-gray-400">Switch between chat and image generation.</p>
          <div class="mt-4 mode-toggle flex gap-2 bg-[#1e1e1e] p-1 rounded-full">
            <button id="toggle-chat" class="px-4 py-2 rounded-full text-sm font-medium ${
              state.mode === "chat" ? "active" : "text-gray-400"
            }">${ChatBubbleIcon()} Chat</button>
            <button id="toggle-image" class="px-4 py-2 rounded-full text-sm font-medium ${
              state.mode === "image" ? "active" : "text-gray-400"
            }">${PhotoIcon()} Image</button>
          </div>
        </header>
        <main id="main-content" class="flex-1 overflow-hidden"></main>
      `;
        updateToggleButtons();
        renderContent();
        attachEventListeners();
      }

      function renderContent() {
        const main = document.getElementById("main-content");
        if (state.mode === "chat") renderChatbot(main);
        else renderImageGenerator(main);
      }

      function renderChatbot(container) {
        container.innerHTML = `
        <div class="flex flex-col h-full">
          <div id="messages-container" class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-4"></div>
          <div class="border-t border-gray-800 p-4 bg-[#121212]">
            <form id="chat-form" class="max-w-3xl mx-auto flex gap-2 items-center">
              <input id="chat-input" type="text" placeholder="Message Gemini..." class="chat-input flex-1" />
              <button id="chat-submit" type="submit" class="send-btn">
                ${PaperAirplaneIcon()}
              </button>
            </form>
          </div>
        </div>
      `;
        renderMessages();
        document
          .getElementById("chat-form")
          .addEventListener("submit", handleChatSubmit);
      }

      function renderMessages() {
        const container = document.getElementById("messages-container");
        if (!container) return;
        container.innerHTML = state.messages
          .map(
            (msg) => `
        <div class="flex ${
          msg.role === "user" ? "justify-end" : "justify-start"
        }">
          <div class="chat-bubble ${msg.role === "user" ? "user" : ""}">
            ${msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
          </div>
        </div>
      `
          )
          .join("");

        if (state.isLoading) {
          container.innerHTML += `
          <div class="flex justify-start">
            <div class="chat-bubble">
              <div class="flex space-x-2 items-center">
                <div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce"></div>
                <div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:0.15s]"></div>
                <div class="h-2 w-2 bg-gray-400 rounded-full animate-bounce [animation-delay:0.3s]"></div>
              </div>
            </div>
          </div>
        `;
        }
        container.scrollTop = container.scrollHeight;
      }

      function renderImageGenerator(container) {
        container.innerHTML = `
        <div class="flex flex-col h-full">
          <div class="flex-1 flex items-center justify-center bg-[#1a1a1a] border border-gray-800 rounded-xl m-6">
            <div id="image-display" class="text-gray-500 text-center">
              ${PhotoIcon("mx-auto h-16 w-16")}
              <p class="mt-2">Your generated image will appear here.</p>
            </div>
          </div>
          <div class="p-4 border-t border-gray-800 bg-[#121212]">
            <form id="image-form" class="max-w-3xl mx-auto flex gap-2">
              <input id="image-prompt" type="text" placeholder="Describe your image..." class="chat-input flex-1">
              <button id="image-submit" type="submit" class="send-btn px-6">Generate</button>
            </form>
          </div>
        </div>
      `;
        document
          .getElementById("image-form")
          .addEventListener("submit", handleImageSubmit);
      }

      function attachEventListeners() {
        document
          .getElementById("toggle-chat")
          .addEventListener("click", () => setMode("chat"));
        document
          .getElementById("toggle-image")
          .addEventListener("click", () => setMode("image"));
      }

      function setMode(mode) {
        if (state.mode === mode) return;
        state.mode = mode;
        render();
      }

      function updateToggleButtons() {
        document
          .querySelectorAll(".mode-toggle button")
          .forEach((btn) => btn.classList.remove("active"));
        if (state.mode === "chat")
          document.getElementById("toggle-chat").classList.add("active");
        else document.getElementById("toggle-image").classList.add("active");
      }

      async function handleChatSubmit(e) {
        e.preventDefault();
        const input = document.getElementById("chat-input");
        const btn = document.getElementById("chat-submit");
        const prompt = input.value.trim();
        if (!prompt || state.isLoading) return;

        state.messages.push({ role: "user", text: prompt });
        input.value = "";
        state.isLoading = true;
        btn.disabled = true;
        renderMessages();

        const res = await runChat(prompt);
        state.messages.push({ role: "model", text: res });
        state.isLoading = false;
        btn.disabled = false;
        renderMessages();
        input.focus();
      }

      function handleImageSubmit(e) {
        e.preventDefault();
        const input = document.getElementById("image-prompt");
        const btn = document.getElementById("image-submit");
        const display = document.getElementById("image-display");
        const prompt = input.value.trim();
        if (!prompt || state.isLoading) return;

        state.isLoading = true;
        btn.disabled = true;
        input.disabled = true;
        display.innerHTML = `<div class="text-gray-400 text-center animate-pulse">Generating your masterpiece...</div>`;

        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(
          prompt
        )}?width=1024&height=1024&nologo=true`;
        const img = new Image();
        img.src = url;
        img.onload = () => {
          display.innerHTML = `<img src="${url}" alt="${prompt}" class="max-h-[512px] rounded-xl shadow-lg mx-auto"/>`;
          btn.disabled = false;
          input.disabled = false;
          state.isLoading = false;
        };
        img.onerror = () => {
          display.innerHTML = `<p class="text-red-400">Failed to generate image.</p>`;
          btn.disabled = false;
          input.disabled = false;
          state.isLoading = false;
        };
      }

      initializeAi();
      render();
    </script>
  </body>
</html>
